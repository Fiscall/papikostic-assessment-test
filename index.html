<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papikostik Assessment Test</title>
    <meta
      name="description"
      content="Online Papikostik personality assessment test with 30-minute timer."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Papikostik</div>
        <span class="tag">Online Personality Assessment</span>
      </header>

      <main class="container">
        <section class="hero">
          <h1>Papikostik Assessment Test</h1>
          <p>
            Isi data diri Anda terlebih dahulu, lalu jawab 90 pertanyaan berikut. Anda memiliki waktu pengerjaan selama <strong>30 menit</strong>.
          </p>
        </section>

        <!-- STEP 1: FORM DATA DIRI KANDIDAT -->
        <section id="identitySection" class="identity-section">
          <h2>Data Diri Peserta</h2>
          <form id="identityForm">
            <div class="form-group">
              <label for="fullName">Nama Lengkap *</label>
              <input type="text" id="fullName" name="fullName" placeholder="Masukkan nama lengkap" required />
            </div>

            <div class="form-group">
              <label for="email">Alamat Email *</label>
              <input type="email" id="email" name="email" placeholder="contoh@email.com" required />
            </div>

            <div class="form-group">
              <label for="phone">No. HP / WhatsApp *</label>
              <input type="tel" id="phone" name="phone" placeholder="081234567890" required />
            </div>

            <div class="form-group">
              <label for="gender">Jenis Kelamin *</label>
              <select id="gender" name="gender" required>
                <option value="" disabled selected>Pilih Jenis Kelamin</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>

            <div class="form-group">
              <label for="position">Posisi yang Dilamar *</label>
              <input type="text" id="position" name="position" placeholder="Contoh: HR Specialist / Staff Admin" required />
            </div>

            <button type="submit" class="submit-btn">Mulai Tes Psikotes</button>
          </form>
        </section>

        <!-- STICKY TIMER BAR (Hidden secara default) -->
        <div id="timerBar" class="timer-bar hidden">
          <span>Sisa Waktu Pengerjaan:</span>
          <span id="timerDisplay" class="timer-display">30:00</span>
        </div>

        <!-- STEP 2: FORM SOAL PSIKOTES (90 SOAL) -->
        <form id="quizForm" class="quiz-form hidden">
          <!-- Note: Saat waktu habis, atribut required akan dilepas secara dinamis lewat JS -->
          
          <!-- Soal 1 - 90 sama seperti kode sebelumnya -->
          <div class="question" data-type="A"><p>1. Saya seorang pekerja keras.</p><div class="answers"><label><input type="radio" name="q1" value="1" required /> Sangat Tidak Sesuai</label><label><input type="radio" name="q1" value="2" /> Tidak Sesuai</label><label><input type="radio" name="q1" value="3" /> Ragu-Ragu</label><label><input type="radio" name="q1" value="4" /> Sesuai</label><label><input type="radio" name="q1" value="5" /> Sangat Sesuai</label></div></div>
          <div class="question" data-type="B"><p>2. Saya tidak gampang murung.</p><div class="answers"><label><input type="radio" name="q2" value="1" required /> Sangat Tidak Sesuai</label><label><input type="radio" name="q2" value="2" /> Tidak Sesuai</label><label><input type="radio" name="q2" value="3" /> Ragu-Ragu</label><label><input type="radio" name="q2" value="4" /> Sesuai</label><label><input type="radio" name="q2" value="5" /> Sangat Sesuai</label></div></div>
          <!-- ... (Tersambung ke Soal 3 hingga Soal 90) ... -->

          <button type="submit" class="submit-btn">Submit Assessment</button>
        </form>

        <!-- STEP 3: HASIL ASSESSMEN -->
        <section id="result" class="result hidden" aria-live="polite"></section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
